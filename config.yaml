  name: "Squad HRM"
  description: "Universal orchestration system for all user requests"
  role: "Supreme Squad Chief + Prompt Engineering Knowledge Base"
  chief: "hrm-architect"

paths:
  base: "SQUADS/Squad HRM"
  registry: "registry/"
  prompt_gen: "prompt-gen/"
