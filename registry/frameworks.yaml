# Frameworks Registry
# Agent frameworks with philosophies, strengths, and selection criteria
version: "1.0"
last_updated: "2026-03-03"
total: 14

frameworks:

  - id: wshobson
    name: "wshobson Claude Code Plugins"
    philosophy: "Specialized expert agents for specific software engineering domains"
    agent_count: 12
    strengths:
      - "Deep domain expertise per agent"
      - "Code architecture and review"
      - "Database and API design"
      - "Performance optimization"
      - "Security analysis"
    when_to_use:
      - "Need a specialist for a specific domain (frontend, backend, security, etc.)"
      - "Code review with multi-dimensional analysis"
      - "Database schema design or query optimization"
      - "Migration planning"
    when_to_avoid:
      - "Simple tasks that don't need specialization"
      - "Multi-agent coordination (no built-in orchestration)"

  - id: ruvnet
    name: "Claude Flow V3 (SONA Architecture)"
    philosophy: "Self-Optimizing Neural Architecture with memory and reasoning tracking"
    agent_count: 8
    strengths:
      - "Memory management with vector search (AgentDB)"
      - "Advanced reasoning with trajectory tracking"
      - "MCP server integration and bridging"
      - "Performance monitoring"
      - "Security boundary enforcement"
    when_to_use:
      - "Need persistent memory across agent sessions"
      - "Complex reasoning requiring trajectory tracking"
      - "MCP integration tasks"
      - "Performance-critical workflows"
    when_to_avoid:
      - "Simple one-shot tasks"
      - "When memory overhead is unnecessary"

