# Asset Registry Schema
# All registry entries must conform to this schema

version: "1.1"   # 1.1: de-drift squad_entry (quality_integration->object, +path/status/evolution) + lineage types

schemas:

  skill_entry:
    required: [id, name, phase, category]
    properties:
      id:
        type: string
        description: "Unique skill identifier (kebab-case)"
      name:
        type: string
        description: "Human-readable name"
      phase:
        type: integer
        enum: [0, 1, 2, 3]
        description: "Execution phase (0=startup, 1=planning, 2=execution, 3=review)"
      category:
        type: string
        enum: [startup, planning, development, frontend, documents, writing, browser, integration, skills, routing, review]
      trigger_conditions:
        type: array
        items: string
        description: "Conditions from CLAUDE.md route table"
      domain_affinity:
        type: array
        items: string
        description: "Domains where this skill is most useful"
      inputs:
        type: array
        items: string
        description: "Expected inputs"
      outputs:
        type: array
        items: string
        description: "Expected outputs"
      estimated_cost:
        type: object
        properties:
          min: { type: integer }
          max: { type: integer }
        description: "Estimated tool calls range"
      composability:
        type: array
        items: string
        description: "Skills this can chain with"
      model_preference:
        type: string
        enum: [opus, sonnet, haiku, any]
        default: any

  agent_entry:
    required: [id, name, framework, subagent_type]
    properties:
      id:
        type: string
        description: "Unique agent identifier"
      name:
        type: string
        description: "Human-readable name"
      framework:
        type: string
        description: "Framework this agent belongs to"
      subagent_type:
        type: string
        description: "Value for Agent tool subagent_type parameter"
      capabilities:
        type: array
        items: string
        description: "What this agent can do"
      tools_available:
        type: array
        items: string
        description: "Tools this agent has access to"
      archetype_mapping:
        type: array
        items:
          type: string
          enum: [L-Architect, L-Builder-Frontend, L-Builder-Backend, L-Builder-Test, L-Builder-Infra, L-Critic, L-Researcher, L-Builder-Data, L-Optimizer]
        description: "HRM archetypes this agent can fill"
      domain_affinity:
        type: array
        items: string
      cost_tier:
        type: string
        enum: [low, medium, high]
        description: "Relative cost of using this agent"

  squad_entry:
    required: [id, name, chief, domain, path]
    properties:
      id:
        type: string
      name:
        type: string
      chief:
        type: string
        description: "Chief agent/role of the squad"
      domain:
        type: string
        description: "Primary domain covered"
      path:
        type: string
        description: "Real on-disk path; verified by evolution/sync_check.py (must resolve)"
      status:
        type: string
        enum: [active, mapped]
        description: "active = built on disk; mapped = mapping doc only (stub)"
      capabilities:
        type: array
        items: string
      delegation_protocol:
        type: string
        description: "How HRM delegates to this squad"
      internal_architecture:
        type: string
        description: "Brief description of internal structure"
      deliverables:
        type: array
        items: string
      quality_integration:
        type: object   # de-drift (B12): data was always an object, schema wrongly said string
        description: "How quality gates integrate with this squad"
        properties:
          gate_owner: { type: string }
          verification_levels: { type: array, items: string }
          acceptance_threshold: { type: [number, string] }
          feedback_loop: { type: string }
      evolution:        # Section 19 leaf declaration (optional until Phase 7 propagation)
        type: object
        properties:
          enabled: { type: boolean }
          primary_kpi: { type: string }
          secondary_kpi: { type: string }
          fitness_direction: { type: string, enum: [maximize, minimize] }
          kpi_measurability: { type: string, enum: [auto, proxy_llm_judge] }
          proxy_validation: { type: object, required_when: "kpi_measurability == proxy_llm_judge" }

  mcp_entry:
    required: [id, name, provider]
    properties:
      id:
        type: string
      name:
        type: string
      provider:
        type: string
        description: "MCP server provider"
      capabilities:
        type: array
        items: string
      domain_affinity:
        type: array
        items: string
      use_cases:
        type: array
        items: string
      authentication:
        type: string
        enum: [none, oauth, api_key, session]

  playbook_entry:
    required: [id, name, domain]
    properties:
      id:
        type: string
      name:
        type: string
      domain:
        type: string
      techniques_used:
        type: array
        items: string
      trigger_conditions:
        type: array
        items: string
      estimated_cost:
        type: object
        properties:
          min: { type: integer }
          max: { type: integer }

  framework_entry:
    required: [id, name, agent_count]
    properties:
      id:
        type: string
      name:
        type: string
      philosophy:
        type: string
      strengths:
        type: array
        items: string
      agent_count:
        type: integer
      when_to_use:
        type: array
        items: string
      when_to_avoid:
        type: array
        items: string

  # --- Section 19 (Evolution Layer) entry types — see evolution/schemas/artifact_entry.schema.yaml ---
  artifact_entry:
    required: [id, type, produced_by, plan_version, created_at, metric_hash]
    properties:
      id: { type: string }
      type: { type: string, enum: [variant, genome, logic_rewrite, crystallized_skill, pipeline_outcome] }
      produced_by: { type: string }
      parent_id: { type: [string, "null"] }
      plan_version: { type: string }
      created_at: { type: string }
      metric_hash: { type: string }
      prev_line_hash: { type: string }

  learned_skill_entry:
    required: [id, fingerprint, origin_squad, file]
    properties:
      id: { type: string }
      fingerprint: { type: string }
      origin_squad: { type: string }
      generality_score: { type: number }
      used_in_squads: { type: array, items: string }
      file: { type: string }
      quality_gate_pass: { type: boolean }

  federation_entry:
    required: [squad, budget_share]
    properties:
      squad: { type: string }
      progress_velocity: { type: number }
      budget_share: { type: number }
      criticality_floor: { type: number }
      dwell_epochs: { type: integer }
