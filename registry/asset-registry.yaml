lookup_protocol:
  description: |
    The HRM uses the registry in Step 0.7 (Registry Lookup) to find
    matching assets for each workstream. The lookup flow is:
    1. Extract domain, type, and complexity from triage
    2. Query skills.yaml for phase-appropriate skills
    3. Query agents.yaml for archetype-matching agents
    4. Query squads.yaml for domain-covered squads
    5. Query mcps.yaml for integration opportunities
    6. Return registry_matches to HRM for plan construction
  query_by:
    - domain_affinity
    - archetype_mapping
    - trigger_conditions
    - capabilities
